<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
:root{--u:14vh;--pad:max(2.6vh,env(safe-area-inset-left));--padr:max(2.6vh,env(safe-area-inset-right));--padb:max(3.4vh,env(safe-area-inset-bottom))}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050607;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#game{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
.ctl{display:none}
body.touch .ctl{display:block}
.btn{position:fixed;width:var(--u);height:var(--u);border-radius:50%;border:2px solid rgba(255,255,255,.32);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.22),rgba(255,255,255,.07) 60%,rgba(0,0,0,.25));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:calc(var(--u)*.19);letter-spacing:.04em;text-shadow:0 1px 3px #000;touch-action:none;opacity:.6;transition:transform .05s,opacity .05s,background .05s;backdrop-filter:blur(2px)}
.btn small{font-size:calc(var(--u)*.14);font-weight:600;opacity:.75;margin-top:1px}
.btn svg{width:46%;height:46%;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 2px #000)}
.btn.on{transform:scale(.92);opacity:1;background:radial-gradient(circle at 35% 30%,rgba(190,255,150,.55),rgba(90,200,80,.28) 60%,rgba(0,0,0,.25));border-color:#c8ffa8}
#bSlash{right:var(--padr);bottom:var(--padb);width:calc(var(--u)*1.12);height:calc(var(--u)*1.12);border-color:rgba(190,255,150,.7)}
#bLunge{right:calc(var(--padr) + var(--u)*1.2);bottom:var(--padb);border-color:rgba(255,190,90,.7)}
#bJump{right:var(--padr);bottom:calc(var(--padb) + var(--u)*1.24)}
#bDodge{right:calc(var(--padr) + var(--u)*1.14);bottom:calc(var(--padb) + var(--u)*1.14);border-color:rgba(120,200,255,.7)}
#pad{position:fixed;left:var(--pad);bottom:var(--padb);width:calc(var(--u)*2.5);height:var(--u);border-radius:999px;border:2px solid rgba(255,255,255,.28);background:rgba(255,255,255,.07);display:flex;touch-action:none;opacity:.78;backdrop-filter:blur(2px)}
#pad div{flex:1;display:flex;align-items:center;justify-content:center}
#pad svg{width:34%;height:34%;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 2px #000)}
#pad.l{background:linear-gradient(90deg,rgba(190,255,150,.4),rgba(255,255,255,.07) 55%)}
#pad.r{background:linear-gradient(270deg,rgba(190,255,150,.4),rgba(255,255,255,.07) 55%)}
.top{position:fixed;top:max(1.6vh,env(safe-area-inset-top));width:calc(var(--u)*.52);height:calc(var(--u)*.52);border-radius:12px;border:1.5px solid rgba(255,255,255,.3);background:rgba(0,0,0,.35);color:#fff;font-weight:800;font-size:calc(var(--u)*.22);display:flex;align-items:center;justify-content:center;opacity:.8;touch-action:none}
#bPause{right:max(1.6vh,env(safe-area-inset-right))}
#bMute{right:calc(max(1.6vh,env(safe-area-inset-right)) + var(--u)*.62)}
#install{position:fixed;left:50%;bottom:max(2vh,env(safe-area-inset-bottom));transform:translateX(-50%);padding:1.1vh 2.4vh;border-radius:999px;border:1.5px solid #9be86a;background:rgba(10,20,10,.8);color:#d9ffb8;font-weight:800;font-size:2.6vh;letter-spacing:.06em;display:none;touch-action:manipulation}
#rotate{position:fixed;inset:0;background:#050607;color:#cfe;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;font-weight:800;font-size:5vw;letter-spacing:.08em;z-index:9;padding:8vw;gap:4vw}
#rotate svg{width:22vw;height:22vw;stroke:#9be86a;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;animation:rot 2.4s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
body.portrait #rotate{display:flex}
@media (orientation:landscape) and (max-height:520px){:root{--u:14.5vh}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="ctl" id="pad"><div><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div><div><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></div></div>
<div class="ctl btn" id="bJump" data-k="jump"><svg viewBox="0 0 24 24"><path d="M12 19V6M6 11l6-6 6 6"/></svg></div>
<div class="ctl btn" id="bDodge" data-k="dodge"><svg viewBox="0 0 24 24"><path d="M4 12h12M11 6l6 6-6 6M20 5v14"/></svg></div>
<div class="ctl btn" id="bLunge" data-k="lunge"><svg viewBox="0 0 24 24"><path d="M3 12h13M12 6l7 6-7 6"/><path d="M3 7h6M3 17h6"/></svg></div>
<div class="ctl btn" id="bSlash" data-k="slash"><svg viewBox="0 0 24 24"><path d="M5 4c9 1 14 7 14 16M9 4c6 2 9 6 9 12"/></svg></div>
<div class="top" id="bPause" style="display:none">II</div>
<div class="top" id="bMute" style="display:none">&#9835;</div>
<button id="install">INSTALL APP</button>
<div id="rotate"><svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>ROTATE YOUR PHONE<br>TO LANDSCAPE</div>
<script>
'use strict';
/* ================= CORE: math, canvas scaling, input, audio ================= */
const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const easeIn=t=>t*t;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const cv=document.getElementById('game');
const ctx=cv.getContext('2d');
const VIEW={S:1,ox:0,oy:0};
const FLOOR=340;          // y where feet touch the ground
let W=900,H=450;          // logical size (H fixed, W follows screen aspect)

function resize(){
  const vw=window.innerWidth,vh=window.innerHeight;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.max(2,Math.round(vw*dpr));cv.height=Math.max(2,Math.round(vh*dpr));
  H=450;W=clamp(Math.round(H*vw/vh/2)*2,720,1000);
  VIEW.S=Math.min(cv.width/W,cv.height/H);
  VIEW.ox=(cv.width-W*VIEW.S)/2;VIEW.oy=(cv.height-H*VIEW.S)/2;
  document.body.classList.toggle('portrait',vh>vw);
  if(window.onGameResize)window.onGameResize();
}

/* ---------- input ---------- */
const Input={down:{},edge:{},touch:false};
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',
  KeyJ:'slash',KeyZ:'slash',KeyK:'lunge',KeyX:'lunge',KeyL:'dodge',KeyC:'dodge',ShiftLeft:'dodge',ShiftRight:'dodge'};
function press(n){if(!Input.down[n])Input.edge[n]=performance.now();Input.down[n]=true}
function release(n){Input.down[n]=false}
function consume(n,win){const t=Input.edge[n];if(t&&performance.now()-t<(win||160)){Input.edge[n]=0;return true}return false}
function clearInput(){for(const k in Input.down)Input.down[k]=false;for(const k in Input.edge)Input.edge[k]=0}

window.addEventListener('keydown',e=>{
  const k=KEYMAP[e.code];
  if(k){press(k);e.preventDefault()}
  if(window.onKey&&!e.repeat)window.onKey(e.code);
});
window.addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k)release(k)});
window.addEventListener('blur',clearInput);

function enableTouch(){if(!Input.touch){Input.touch=true;document.body.classList.add('touch')}}
if(window.matchMedia&&matchMedia('(pointer:coarse)').matches)enableTouch();
window.addEventListener('touchstart',enableTouch,{passive:true});

document.querySelectorAll('[data-k]').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}press(k);b.classList.add('on');enableTouch();audioInit()});
  const up=()=>{release(k);b.classList.remove('on')};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
});
(function(){
  const pad=document.getElementById('pad');let pid=null;
  function upd(e){
    const r=pad.getBoundingClientRect();const x=(e.clientX-r.left)/r.width;
    const L=x<.5,R=!L;
    Input.down.left=L;Input.down.right=R;pad.classList.toggle('l',L);pad.classList.toggle('r',R);
  }
  pad.addEventListener('pointerdown',e=>{e.preventDefault();pid=e.pointerId;try{pad.setPointerCapture(pid)}catch(_){}upd(e);enableTouch();audioInit()});
  pad.addEventListener('pointermove',e=>{if(e.pointerId===pid)upd(e)});
  const up=e=>{pid=null;Input.down.left=false;Input.down.right=false;pad.classList.remove('l','r')};
  pad.addEventListener('pointerup',up);pad.addEventListener('pointercancel',up);pad.addEventListener('lostpointercapture',up);
})();
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ---------- audio (all synthesized, no files) ---------- */
let AC=null,master=null,muted=false,noiseBuf=null,hum=null;
try{muted=localStorage.getItem('mvm_mute')==='1'}catch(_){}
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null;return}
  master=AC.createGain();master.gain.value=muted?0:.8;master.connect(AC.destination);
  const n=AC.sampleRate;noiseBuf=AC.createBuffer(1,n,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  startHum();
}
function setMuted(m){muted=m;try{localStorage.setItem('mvm_mute',m?'1':'0')}catch(_){}if(master)master.gain.value=m?0:.8}
function tone(f,dur,type,vol,slide,delay){
  if(!AC||muted)return;const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(25,f+slide),t+dur);
  g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.03);
}
function noise(dur,vol,f0,f1,q,type,delay){
  if(!AC||muted||!noiseBuf)return;const t=AC.currentTime+(delay||0);
  const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
  const f=AC.createBiquadFilter();f.type=type||'bandpass';f.frequency.setValueAtTime(f0,t);
  f.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+dur);f.Q.value=q||.8;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.03);
}
function startHum(){
  if(!AC||hum)return;
  const o1=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
  o1.type='sawtooth';o2.type='sawtooth';o1.frequency.value=48;o2.frequency.value=48.7;f.type='lowpass';f.frequency.value=180;
  g.gain.value=.05;o1.connect(f);o2.connect(f);f.connect(g);g.connect(master);o1.start();o2.start();
  hum={o1,o2,g,f};
}
function setHum(level){if(!hum||!AC)return;const t=AC.currentTime;hum.o1.frequency.linearRampToValueAtTime(44+level*8,t+1);hum.o2.frequency.linearRampToValueAtTime(44.7+level*8,t+1);hum.f.frequency.linearRampToValueAtTime(150+level*60,t+1)}
const sfx={
  slash(){noise(.14,.22,3600,900,.9);tone(720,.08,'triangle',.05,-420)},
  slash3(){noise(.24,.32,2600,500,.8);tone(320,.2,'sawtooth',.08,-200)},
  lunge(){noise(.26,.26,1200,5200,.7);tone(210,.24,'sawtooth',.07,520)},
  dodge(){noise(.16,.12,5200,1600,1.2,'highpass')},
  jump(){tone(280,.12,'triangle',.06,260)},
  hit(){noise(.12,.34,1900,300,1);tone(160,.12,'square',.1,-90)},
  hitHeavy(){noise(.2,.5,1400,120,.8);tone(110,.2,'square',.16,-60);tone(60,.3,'sine',.3,-20)},
  hurt(){tone(210,.28,'sawtooth',.14,-150);noise(.22,.32,900,200)},
  whirr(){tone(170,.55,'sawtooth',.045,540);noise(.55,.07,2000,5200,2)},
  launch(){noise(.18,.25,900,2800,1.2);tone(140,.2,'square',.07,120)},
  slam(){noise(.45,.55,420,60,.7,'lowpass');tone(90,.34,'sine',.35,-50)},
  boom(){noise(1,.65,900,50,.5,'lowpass');tone(70,.9,'sine',.4,-40)},
  beam(){noise(.8,.24,600,2800,3);tone(110,.8,'sawtooth',.1,70)},
  charge(){tone(260,.8,'sawtooth',.05,900)},
  tick(){tone(900,.04,'square',.05)},
  ui(){tone(660,.08,'square',.05);tone(990,.1,'square',.05,0,.07)},
  clear(){[523,659,784,1047].forEach((f,i)=>tone(f,.22,'square',.07,0,i*.11))},
  lose(){[330,262,208,156].forEach((f,i)=>tone(f,.32,'sawtooth',.08,-20,i*.18))},
};
/* ================= ART: everything is drawn in code (vector "sprites") ================= */
function circle(c,x,y,r){c.beginPath();c.arc(x,y,r,0,TAU)}
function rr(c,x,y,w,h,r){
  c.beginPath();
  if(c.roundRect){c.roundRect(x,y,w,h,r);return}
  r=Math.min(r,w/2,h/2);c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();
}
function lg(c,x0,y0,x1,y1,stops){const g=c.createLinearGradient(x0,y0,x1,y1);for(const s of stops)g.addColorStop(s[0],s[1]);return g}
function rg(c,x,y,r0,r1,stops){const g=c.createRadialGradient(x,y,r0,x,y,r1);for(const s of stops)g.addColorStop(s[0],s[1]);return g}
function limb(c,x1,y1,x2,y2,w1,w2,fill,stroke){
  const a=Math.atan2(y2-y1,x2-x1),nx=-Math.sin(a),ny=Math.cos(a);
  c.beginPath();
  c.moveTo(x1+nx*w1/2,y1+ny*w1/2);c.lineTo(x2+nx*w2/2,y2+ny*w2/2);
  c.arc(x2,y2,w2/2,a+Math.PI/2,a-Math.PI/2,true);
  c.lineTo(x1-nx*w1/2,y1-ny*w1/2);
  c.arc(x1,y1,w1/2,a-Math.PI/2,a+Math.PI/2,true);
  c.closePath();
  if(fill){c.fillStyle=fill;c.fill()}
  if(stroke){c.strokeStyle=stroke;c.lineWidth=1.3;c.stroke()}
}
function ik(hx,hy,fx,fy,l1,l2){
  let dx=fx-hx,dy=fy-hy,d=Math.hypot(dx,dy);const mx=l1+l2-.5;
  if(d>mx){const k=mx/d;dx*=k;dy*=k;d=mx}
  if(d<8)d=8;
  const a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-a*a));
  const px=hx+dx*a/d,py=hy+dy*a/d,ox=-dy/d*h,oy=dx/d*h;
  const k1={x:px+ox,y:py+oy},k2={x:px-ox,y:py-oy};
  const k=k1.y<k2.y?k1:k2;
  return{kx:k.x,ky:k.y,fx:hx+dx,fy:hy+dy};
}
function screw(c,x,y,r){circle(c,x,y,r);c.fillStyle='#59636e';c.fill();c.strokeStyle='rgba(0,0,0,.5)';c.lineWidth=.8;c.stroke();c.beginPath();c.moveTo(x-r*.6,y);c.lineTo(x+r*.6,y);c.strokeStyle='rgba(0,0,0,.6)';c.stroke()}
function glowDot(c,x,y,r,col,a){c.save();c.globalCompositeOperation='lighter';c.fillStyle=rg(c,x,y,0,r,[[0,col.replace('A',a)],[1,col.replace('A',0)]]);c.fillRect(x-r,y-r,r*2,r*2);c.restore()}

/* ---------- THE MANTIS ---------- */
const LEGS=[{hx:10,fx:26,ph:0,far:false},{hx:-16,fx:-34,ph:Math.PI,far:false},{hx:5,fx:12,ph:Math.PI,far:true},{hx:-21,fx:-22,ph:0,far:true}];
function mLeg(c,L,m,hipY){
  const hx=L.hx,hy=-hipY+7;
  let fx=L.fx+Math.sin(m.walk+L.ph)*22*m.speed,fy=-Math.max(0,Math.cos(m.walk+L.ph))*14*m.speed;
  if(m.air>0){fx=lerp(fx,hx+(L.fx>hx?17:-17)+Math.sin(m.t*10+L.ph)*2,m.air);fy=lerp(fy,-hipY*.55,m.air)}
  const k=ik(hx,hy,fx,fy,33,42);
  const fill=L.far?'#2e7d3d':'#56bd4b',edge=L.far?'#12381f':'#14502a',w=L.far?.85:1;
  limb(c,hx,hy,k.kx,k.ky,9*w,6.5*w,fill,edge);
  limb(c,k.kx,k.ky,k.fx,k.fy,6.5*w,2.6*w,fill,edge);
  circle(c,k.kx,k.ky,3.4*w);c.fillStyle=L.far?'#245f31':'#3a9a3d';c.fill();
  limb(c,k.fx,k.fy,k.fx+5,k.fy+(k.fy>-3?0:2),3,1.6,edge,null);
}
function mForeleg(c,sx,sy,fa,ta,far){
  const L1=42,L2=47;
  const ex=sx+Math.cos(fa)*L1,ey=sy+Math.sin(fa)*L1,tx=ex+Math.cos(ta)*L2,ty=ey+Math.sin(ta)*L2;
  const edge=far?'#12381f':'#14502a';
  const f1=far?lg(c,sx,sy-8,sx,sy+8,[[0,'#3b9648'],[1,'#1f5e2d']]):lg(c,sx,sy-8,sx,sy+8,[[0,'#8fe36c'],[.5,'#56bd4b'],[1,'#2c8a3a']]);
  const sgn=Math.sin(ta-fa)<-.05?-1:1;
  // spines
  c.fillStyle=far?'#e0e6c8':'#fff6d2';c.strokeStyle=edge;c.lineWidth=1;
  const nf={x:-Math.sin(fa)*sgn,y:Math.cos(fa)*sgn},nt={x:-Math.sin(ta)*sgn,y:Math.cos(ta)*sgn};
  for(let i=1;i<=5;i++){const f=i/5.6,px=sx+(ex-sx)*f,py=sy+(ey-sy)*f;c.beginPath();c.moveTo(px-Math.cos(fa)*3,py-Math.sin(fa)*3);c.lineTo(px+Math.cos(fa)*3,py+Math.sin(fa)*3);c.lineTo(px+nf.x*(11-i*.4)+Math.cos(fa)*2,py+nf.y*(11-i*.4)+Math.sin(fa)*2);c.closePath();c.fill();c.stroke()}
  for(let i=1;i<=4;i++){const f=i/4.8,px=ex+(tx-ex)*f,py=ey+(ty-ey)*f;c.beginPath();c.moveTo(px-Math.cos(ta)*2.6,py-Math.sin(ta)*2.6);c.lineTo(px+Math.cos(ta)*2.6,py+Math.sin(ta)*2.6);c.lineTo(px+nt.x*(8-i*.5),py+nt.y*(8-i*.5));c.closePath();c.fill();c.stroke()}
  limb(c,sx,sy,ex,ey,14,9.5,f1,edge);
  limb(c,ex,ey,tx,ty,9,3.2,far?'#2c7a3a':lg(c,ex,ey-5,ex,ey+5,[[0,'#7fd763'],[1,'#2f8f3c']]),edge);
  // claw tip
  const hxn=tx+Math.cos(ta)*7+nt.x*3,hyn=ty+Math.sin(ta)*7+nt.y*3;
  c.beginPath();c.moveTo(tx+nt.x*1.4,ty+nt.y*1.4);c.quadraticCurveTo(tx+Math.cos(ta)*5+nt.x*5,ty+Math.sin(ta)*5+nt.y*5,hxn,hyn);c.quadraticCurveTo(tx+Math.cos(ta)*5,ty+Math.sin(ta)*5,tx-nt.x*1.4,ty-nt.y*1.4);c.closePath();c.fillStyle='#fff3c2';c.fill();c.strokeStyle=edge;c.stroke();
  circle(c,ex,ey,5.6);c.fillStyle=far?'#2a7437':'#46a746';c.fill();c.strokeStyle=edge;c.stroke();
  circle(c,sx,sy,6.5);c.fillStyle=far?'#256a33':'#3f9c42';c.fill();c.strokeStyle=edge;c.stroke();
}
function mWing(c,wx,wy,len,ang,alpha,far){
  c.save();c.translate(wx,wy);c.rotate(ang);
  c.beginPath();c.moveTo(0,0);c.bezierCurveTo(len*.22,-15,len*.68,-17,len,-3);c.bezierCurveTo(len*.72,6,len*.25,6,0,0);c.closePath();
  c.fillStyle=lg(c,0,-14,0,8,[[0,'rgba(190,255,215,'+alpha+')'],[1,'rgba(90,200,170,'+alpha*.85+')']]);c.fill();
  c.strokeStyle='rgba(20,90,70,'+(alpha*.8)+')';c.lineWidth=1;c.stroke();
  c.strokeStyle='rgba(20,100,80,'+(alpha*.55)+')';c.lineWidth=.8;
  for(let i=0;i<6;i++){c.beginPath();c.moveTo(len*.08,0);c.quadraticCurveTo(len*(.4+i*.08),-12+i*3.4,len*(.62+i*.07),-9+i*2.6);c.stroke()}
  c.restore();
}
function drawMantis(c,m){
  const t=m.t,sp=m.speed,idle=1-sp;

  const th=-1.08+m.lean;
  const T0={x:-4,y:-hipY},TL=60;
  const T1={x:T0.x+Math.cos(th)*TL,y:T0.y+Math.sin(th)*TL};
  const hd={x:T1.x+4+m.headX,y:T1.y-9+m.headY};
  c.save();
  c.translate(0,-48);c.rotate(m.rot||0);c.translate(0,48);
  c.lineJoin='round';
  // far legs
  mLeg(c,LEGS[2],m,hipY);mLeg(c,LEGS[3],m,hipY);
  // far wing + far foreleg
  const wopen=m.wing,wang=Math.PI+.04-wopen*1.05;

  // abdomen
  const tail={x:-96,y:-hipY-9+Math.sin(t*2.1)*2.5-m.air*4+m.tailUp};
  c.beginPath();
  c.moveTo(T0.x+6,T0.y-9);

  c.quadraticCurveTo(-48,-hipY+11,T0.x+4,T0.y+10);

  c.strokeStyle='#14502a';c.lineWidth=1.5;c.stroke();

  c.strokeStyle='rgba(15,70,35,.55)';c.lineWidth=1.2;
  for(let i=1;i<9;i++){const u=i/9.4,bx=lerp(T0.x+4,tail.x,u),by=lerp(T0.y,tail.y,u),hh=(1-u*.72)*11.5;c.beginPath();c.moveTo(bx-2,by-hh);c.quadraticCurveTo(bx-6,by,bx-2,by+hh*.95);c.stroke()}

  // near wing(s)

  limb(c,T0.x,T0.y,T1.x,T1.y,15,10,lg(c,T0.x,T0.y,T1.x,T1.y,[[0,'#3fa844'],[.6,'#6ccb56'],[1,'#9aea72']]),'#14502a');
  c.strokeStyle='rgba(215,250,150,.7)';c.lineWidth=2;c.beginPath();c.moveTo(T0.x+3,T0.y+2);c.lineTo(T1.x+2,T1.y+3);c.stroke();
  c.strokeStyle='rgba(15,70,35,.5)';c.lineWidth=1.2;for(let i=1;i<4;i++){const u=i/4.2,bx=lerp(T0.x,T1.x,u),by=lerp(T0.y,T1.y,u);c.beginPath();c.moveTo(bx-6,by+3);c.lineTo(bx+6,by-3);c.stroke()}
  // near legs
  mLeg(c,LEGS[1],m,hipY);mLeg(c,LEGS[0],m,hipY);

  limb(c,T1.x,T1.y,hd.x,hd.y+4,9,7,'#4fb94a','#14502a');
  c.save();c.translate(hd.x,hd.y);c.rotate(m.headTilt+m.lean*.4);

  // face plate
  c.beginPath();c.moveTo(-10,-2);c.quadraticCurveTo(-7,-15,6,-15);c.quadraticCurveTo(16,-13,16,-2);c.lineTo(14,9);c.lineTo(9,16);c.lineTo(-1,9);c.quadraticCurveTo(-11,6,-10,-2);c.closePath();

function eyeLED(c,x,y,glow,t,w,h){
  c.save();c.translate(x,y);
  c.beginPath();c.moveTo(-w/2,-h*.1);c.lineTo(w/2,-h/2);c.lineTo(w/2,h*.4);c.lineTo(-w/2,h/2);c.closePath();
  c.fillStyle='#120606';c.fill();
  const a=.45+glow*.55+Math.sin(t*6)*.05;
  c.beginPath();c.moveTo(-w/2+2,-h*.1+.5);c.lineTo(w/2-1.5,-h/2+2);c.lineTo(w/2-1.5,h*.4-1);c.lineTo(-w/2+2,h/2-2);c.closePath();
  c.fillStyle='rgba(255,'+Math.round(70+glow*150)+','+Math.round(30+glow*130)+','+a+')';c.fill();
  c.restore();

}

/* ---------- Enemy 3: chainsaw ---------- */
function chainPt(s,x0,x1,r){
  const L=x1-x0,arc=Math.PI*r,tot=2*L+2*arc;s=((s%tot)+tot)%tot;
  if(s<L)return{x:x1-s,y:-r,nx:0,ny:-1};
  s-=L;if(s<arc){const a=-Math.PI/2-s/r;return{x:x0+Math.cos(a)*r,y:Math.sin(a)*r,nx:Math.cos(a),ny:Math.sin(a)}}
  s-=arc;if(s<L)return{x:x0+s,y:r,nx:0,ny:1};
  s-=L;const a=Math.PI/2-s/r;return{x:x1+Math.cos(a)*r,y:Math.sin(a)*r,nx:Math.cos(a),ny:Math.sin(a)};
}

  const total=2*(x1-x0)+2*Math.PI*r,sp=34,n=Math.floor(total/sp),ph=(t*rev*520)%sp;

function sparkDir(x,y,n,ang,spread,spd,col,life){for(let i=0;i<n;i++){const a=ang+rand(-spread,spread),s=rand(.4,1)*spd;parts.push({k:'spark',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:life*rand(.6,1),max:life,col:col||'255,210,110',g:700})}}
function smoke(x,y,n,r,col){for(let i=0;i<n;i++)parts.push({k:'smoke',x:x+rand(-r,r),y:y+rand(-r,r),vx:rand(-30,30),vy:rand(-60,-15),r:rand(8,18),life:rand(.7,1.4),max:1.4,col:col||'40,40,44'})}
function ember(x,y,n,spd,col){for(let i=0;i<n;i++)parts.push({k:'ember',x,y,vx:rand(-spd,spd),vy:rand(-spd*1.4,-spd*.2),r:rand(1.5,3.4),life:rand(.5,1.2),max:1.2,col:col||'255,150,40',g:-40})}
function debris(x,y,n,spd,cols){for(let i=0;i<n;i++)parts.push({k:'deb',x,y,vx:rand(-spd,spd),vy:rand(-spd*1.2,-spd*.2),r:rand(2,6),rot:rand(0,TAU),vr:rand(-9,9),life:rand(.8,1.6),max:1.6,col:pick(cols||['#8a8278','#5e584f','#b0a89c']),g:1300})}
function ring(x,y,r0,r1,life,col,w){parts.push({k:'ring',x,y,r0,r1,life,max:life,col:col||'255,230,170',w:w||3})}
function glow(x,y,r,life,col){parts.push({k:'glow',x,y,r,life,max:life,col:col||'255,200,120'})}
function dust(x,y,n){for(let i=0;i<n;i++)parts.push({k:'smoke',x:x+rand(-14,14),y:y-rand(0,4),vx:rand(-70,70),vy:rand(-40,-5),r:rand(4,9),life:rand(.35,.7),max:.7,col:'150,140,128'})}
function updateParts(dt){
  if(parts.length>700)parts.splice(0,parts.length-700);
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue}
    if(p.k==='ring'||p.k==='glow')continue;
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.g)p.vy+=p.g*dt;
    if(p.k==='smoke'){p.r+=dt*22;p.vx*=.98}
    if(p.k==='deb'){p.rot+=p.vr*dt;if(p.y>FLOOR+8+Math.abs(p.vx)*.02&&p.vy>0){p.y=FLOOR+8;p.vy*=-.35;p.vx*=.6;p.vr*=.5}}
    if(p.k==='spark'&&p.y>FLOOR+14){p.y=FLOOR+14;p.vy*=-.3;p.vx*=.7}
  }
  for(let i=nums.length-1;i>=0;i--){const n=nums[i];n.life-=dt;n.y-=48*dt;n.x+=n.vx*dt;if(n.life<=0)nums.splice(i,1)}
  for(let i=fxs.length-1;i>=0;i--){const f=fxs[i];f.t+=dt;if(f.t>=f.life)fxs.splice(i,1)}
}
function drawParts(c,layer){
  for(const p of parts){
    const k=p.life/p.max;
    if((layer==='back')!==(p.k==='smoke'||p.k==='glow'))continue;
    if(p.k==='spark'){c.save();c.globalCompositeOperation='lighter';c.strokeStyle='rgba('+p.col+','+Math.min(1,k*1.6)+')';c.lineWidth=1.6;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-p.vx*.035,p.y-p.vy*.035);c.stroke();c.restore()}
    else if(p.k==='ember'){c.save();c.globalCompositeOperation='lighter';c.fillStyle='rgba('+p.col+','+k+')';circle(c,p.x,p.y,p.r*(.4+k*.6));c.fill();c.restore()}
    else if(p.k==='smoke'){c.fillStyle='rgba('+p.col+','+(k*.4)+')';circle(c,p.x,p.y,p.r);c.fill()}
    else if(p.k==='deb'){c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle=p.col;c.globalAlpha=Math.min(1,k*2);c.fillRect(-p.r,-p.r*.6,p.r*2,p.r*1.2);c.restore()}
    else if(p.k==='ring'){const t=1-k;c.save();c.globalCompositeOperation='lighter';c.strokeStyle='rgba('+p.col+','+k*.8+')';c.lineWidth=p.w*k+1;c.beginPath();c.ellipse(p.x,p.y,lerp(p.r0,p.r1,easeOut(t)),lerp(p.r0,p.r1,easeOut(t))*.3,0,0,TAU);c.stroke();c.restore()}
    else if(p.k==='glow'){c.save();c.globalCompositeOperation='lighter';c.fillStyle=rg(c,p.x,p.y,0,p.r,[[0,'rgba('+p.col+','+k*.9+')'],[1,'rgba('+p.col+',0)']]);c.fillRect(p.x-p.r,p.y-p.r,p.r*2,p.r*2);c.restore()}
  }
}

/* ---------- hazards ---------- */
function haz(o){const h=Object.assign({shape:'rect',x:0,y:0,w:10,h:10,r:10,dmg:10,life:1,t:0,once:true,hit:false,tick:0,tcd:0,vx:0,vy:0,g:0,dead:false,arm:0},o);hazs.push(h);return h}
function segDist(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;let t=l2?((px-x1)*dx+(py-y1)*dy)/l2:0;t=clamp(t,0,1);return Math.hypot(px-(x1+dx*t),py-(y1+dy*t))}
function pBox(){return{x0:P.x-17,x1:P.x+17,y0:P.y-98,y1:P.y-4}}
function overlapsPlayer(h){
  const b=pBox();
  if(h.shape==='rect')return h.x+h.w/2>b.x0&&h.x-h.w/2<b.x1&&h.y+h.h/2>b.y0&&h.y-h.h/2<b.y1;
  if(h.shape==='circle'){const cx=clamp(h.x,b.x0,b.x1),cy=clamp(h.y,b.y0,b.y1);return Math.hypot(h.x-cx,h.y-cy)<h.r}
  if(h.shape==='beam'){const rad=h.w*.42+8;for(const yy of [P.y-92,P.y-52,P.y-12])if(segDist(P.x,yy,h.x1,h.y1,h.x2,h.y2)<rad)return true;return false}
  return false;
}
function updateHaz(dt){
  for(const h of hazs){
    h.t+=dt;h.life-=dt;
    if(h.follow)h.follow(h);
    if(h.upd)h.upd(h,dt);
    h.x+=h.vx*dt;h.y+=h.vy*dt;h.vy+=h.g*dt;
    if(h.life<=0)h.dead=true;
    if(h.dead)continue;
    if(h.tcd>0)h.tcd-=dt;
    if(h.t<h.arm||P.state==='dead')continue;
    if(h.once&&h.hit)continue;
    if(h.tcd>0)continue;
    if(overlapsPlayer(h)){if(hurtPlayer(h.dmg,h.shape==='beam'?h.x1:h.x)){h.hit=true;h.tcd=h.tick||0;if(h.killOnHit)h.dead=true}}
  }
  for(let i=hazs.length-1;i>=0;i--)if(hazs[i].dead)hazs.splice(i,1);
}
function drawHaz(c){
  for(const h of hazs){
    if(!h.draw||h.dead)continue;
    h.draw(c,h);
  }
}
function floorMark(xin,w,dur,col){
  return addFx(dur,(c,f)=>{const k=f.t/f.life,pul=.5+.5*Math.sin(f.t*22);const x=typeof xin==='function'?xin():xin;
    c.save();c.globalCompositeOperation='lighter';
    c.fillStyle=rg(c,x,FLOOR+8,2,w,[[0,'rgba('+(col||'255,50,30')+','+(.35+pul*.35)+')'],[1,'rgba('+(col||'255,50,30')+',0)']]);
    c.beginPath();c.ellipse(x,FLOOR+8,w,w*.22,0,0,TAU);c.fill();
    c.strokeStyle='rgba(255,'+Math.round(80+pul*120)+',60,'+(.5+k*.4)+')';c.lineWidth=2;c.beginPath();c.ellipse(x,FLOOR+8,w*(1-k*.4),w*.22*(1-k*.4),0,0,TAU);c.stroke();
    c.restore()},'back');
}

/* ---------- damage ---------- */
function hurtPlayer(dmg,srcx){
  const p=P;if(p.inv>0||p.state==='dead'||G.state!=='fight')return false;
  p.hp=Math.max(0,p.hp-dmg);p.inv=1;G.hurtFlash=.35;
  p.state='hurt';p.st=0;p.hitDone=true;
  p.vx=(p.x<(srcx==null?p.x+1:srcx)?-1:1)*270;p.vy=-230;p.ground=false;
  shake(9);hitstop(.07);vib(40);sfx.hurt();
  spark(p.x,p.y-60,14,380,'255,120,70',.4);num(p.x,p.y-110,'-'+Math.round(dmg),'#ff5a4a',true);
  if(p.hp<=0)playerDie();
  return true;
}
function playerDie(){
  const p=P;p.state='dead';p.st=0;p.deadT=0;G.state='dead';G.stateT=0;G.deaths++;
  G.slow=.4;G.slowT=.9;sfx.lose();vib([80,60,160]);setHum(0);
  spark(p.x,p.y-50,30,420,'140,255,120',.8);
}
function hurtEnemy(dmg,kind){
  const e=E;if(!e||e.dead)return false;
  if(e.inv){sparkDir(e.x,e.y+40,8,Math.PI,.9,260,'200,220,255',.3);sfx.tick();num(e.x,e.y-20,'CLANG','#aac8ff');hitstop(.03);return false}
  dmg=Math.round(dmg*e.dmgMul);
  e.hp=Math.max(0,e.hp-dmg);e.flash=.13;e.hitAt=P.t;
  const heavy=kind==='heavy'||kind==='lunge';
  hitstop(heavy?.085:.055);shake(heavy?8:4);vib(heavy?35:15);
  (heavy?sfx.hitHeavy:sfx.hit)();
  const hx=e.x+e.ox+e.hb.ox-e.hb.w*.35*P.face,hy=P.y-62;
  sparkDir(hx,hy,heavy?18:10,P.face>0?Math.PI:0,1.1,420,heavy?'255,240,170':'255,210,110',.4);
  ring(hx,hy+30,6,heavy?60:36,.25,'255,255,220',3);
  num(hx,hy-30,String(dmg),heavy?'#ffe14a':'#ffffff',heavy);
  P.meter=(P.meter||0);
  if(e.hp<=0)killEnemy();
  return true;
}
function killEnemy(){
  const e=E;e.dead=true;e.deadT=0;e.flash=.2;
  G.state='clear';G.stateT=0;G.slow=.3;G.slowT=e.def.boss?1.8:1.1;
  hazs.length=0;fxs.length=0;
  sfx.boom();vib([60,40,120]);shake(18);screenFlash(.55);
  P.vx=0;
}

/* ---------- generator helpers for enemy brains ---------- */
function* wait(e,s){let t=0;while(t<s){yield;t+=e.dt}}
function* tween(e,s,fn){let t=0;while(t<s){yield;t+=e.dt;fn(Math.min(1,t/s))}fn(1)}
function weighted(opts,last){let sum=0;const w=opts.map(o=>{const v=o[0]===last?o[1]*.35:o[1];sum+=v;return v});let r=Math.random()*sum;for(let i=0;i<opts.length;i++){r-=w[i];if(r<=0)return opts[i][0]}return opts[0][0]}
function* hover(e,secs,ideal,minX){
  let t=0;
  while(t<secs){yield;t+=e.dt;
    const tx=clamp(P.x+ideal,minX||W*.5,W-110);
    e.x+=clamp((tx-e.x)*2.2,-170,170)*e.dt;
    e.oy=Math.sin(e.t*2.3)*6;e.tilt=Math.sin(e.t*1.7)*.02;
  }
}
function e_rect(e){return{x0:e.x+e.ox+e.hb.ox-e.hb.w/2,x1:e.x+e.ox+e.hb.ox+e.hb.w/2,y0:e.y+e.oy+e.hb.oy-e.hb.h/2,y1:e.y+e.oy+e.hb.oy+e.hb.h/2}}
function spawnProj(o){return haz(Object.assign({life:4},o))}

/* ---------- ENEMY 1: DRILL ---------- */
function* brainDrill(e){
  yield* wait(e,1.1);let last='';
  for(;;){
    yield* hover(e,rand(.5,.9),310);
    const near=e.x-P.x<340;
    const a=weighted([['thrust',near?3:1.2],['charge',2.2],['barrage',near?1.2:3]],last);last=a;
    if(a==='thrust')yield* drillThrust(e);else if(a==='charge')yield* drillCharge(e);else yield* drillBarrage(e);
    e.glow=0;e.rev=.25;e.ox=0;e.tilt=0;
  }
}
function* drillThrust(e){
  sfx.whirr();const sx=e.x;
  yield* tween(e,.58,k=>{e.ox=k*42;e.rev=.25+k*.75;e.glow=k;e.tilt=-k*.06;e.jit=k});
  const dist=clamp(e.x-P.x-60,130,350);sfx.launch();
  const hz=haz({shape:'rect',w:236,h:64,dmg:11,life:9,follow:h=>{h.x=e.x+e.ox-92;h.y=e.y+e.oy+6}});
  yield* tween(e,.13,k=>{e.x=sx-dist*easeOut(k);e.ox=lerp(42,-12,k);e.tilt=0});
  spark(e.x-190,e.y+4,10,320,'255,220,130',.3);
  yield* wait(e,.2);hz.dead=true;e.dmgMul=1.5;
  yield* tween(e,.55,k=>{e.x=lerp(sx-dist,sx,ease(k));e.ox=lerp(-12,0,k);e.rev=lerp(1,.25,k);e.glow=1-k});
  yield* wait(e,.15);e.dmgMul=1;
}
function* drillCharge(e){
  sfx.whirr();sfx.charge();const y0=e.y;
  yield* tween(e,.75,k=>{e.glow=k;e.rev=1;e.y=lerp(y0,y0+32,k);e.ox=k*30;e.jit=k});
  sfx.launch();
  const hz=haz({shape:'rect',w:190,h:76,dmg:13,life:9,follow:h=>{h.x=e.x+e.ox-80;h.y=e.y+e.oy+4}});
  while(e.x>-280){yield;e.x-=740*e.dt;if(Math.random()<.7)sparkDir(e.x-120,FLOOR+10,2,-Math.PI*.1,.4,260,'255,210,120',.3)}
  hz.dead=true;e.glow=0;
  yield* wait(e,.55);
  e.y=y0;e.ox=0;e.x=W+280;
  yield* tween(e,.95,k=>{e.x=lerp(W+280,e.baseX,easeOut(k));e.rev=lerp(1,.25,k)});
  e.dmgMul=1.5;yield* wait(e,.45);e.dmgMul=1;
}
function* drillBarrage(e){
  sfx.whirr();
  yield* tween(e,.5,k=>{e.glow=k;e.rev=.4+k*.6;e.ox=k*14});
  const rows=[-14,34,82].sort(()=>Math.random()-.5);
  for(let i=0;i<3;i++){
    sfx.launch();const y=e.y+rows[i];
    spawnProj({shape:'circle',r:11,x:e.x+e.ox-176,y,vx:-620,dmg:7,life:3,killOnHit:true,
      upd:(h,dt)=>{if(Math.random()<.5)parts.push({k:'spark',x:h.x+8,y:h.y,vx:rand(60,160),vy:rand(-30,30),life:.2,max:.2,col:'255,190,100',g:0});if(h.x<-40)h.dead=true},
      draw:(c,h)=>drawBolt(c,h.x,h.y,G.t,0)});
    spark(e.x-176,y,6,260,'255,220,140',.25);
    e.ox=14-18;yield* wait(e,.1);e.ox=14;
    yield* wait(e,.32);
  }
  yield* tween(e,.4,k=>{e.glow=1-k;e.rev=lerp(1,.25,k);e.ox=lerp(14,0,k)});
}

/* ---------- ENEMY 2: CIRCULAR SAW ---------- */
function* brainSaw(e){
  yield* wait(e,1.1);let last='';
  for(;;){
    yield* hover(e,rand(.5,.9),320);
    const a=weighted([['throw',3],['slide',2],['rain',2.4]],last);last=a;
    if(a==='throw')yield* sawThrow(e);else if(a==='slide')yield* sawSlide(e);else yield* sawRain(e);
    e.glow=0;e.rev=.3;e.ox=0;e.tilt=0;e.bladeOut=true;
  }
}
function* sawThrow(e){
  sfx.whirr();
  yield* tween(e,.65,k=>{e.glow=k;e.rev=.4+k*.6;e.ox=k*26;e.jit=k});
  sfx.launch();
  const bx=e.x+e.ox-28,by=e.y+6;e.bladeOut=false;let back=false,got=false;
  const bl=spawnProj({shape:'circle',r:38,x:bx,y:by,vx:-640,dmg:11,life:7,rot:0,
    upd:(h,dt)=>{h.rot+=dt*30;h.y+=(FLOOR-32-h.y)*Math.min(1,9*dt);
      if(Math.random()<.6)sparkDir(h.x,h.y+34,1,-Math.PI/2,.8,200,'255,200,110',.25);
      if(!back&&h.x<70){back=true;h.vx=720;h.hit=false;sfx.launch();shake(4)}
      if(back&&h.x>e.x+e.ox-40){h.dead=true;got=true;e.bladeOut=true;spark(e.x-28,e.y+6,12,300,'255,220,140',.3);sfx.tick()}},
    draw:(c,h)=>drawBlade(c,h.x,h.y,58,h.rot)});
  e.glow=0;e.rev=.2;e.dmgMul=1.5;
  yield* tween(e,.4,k=>{e.ox=lerp(26,0,k)});
  while(!got&&!bl.dead)yield;
  e.bladeOut=true;e.dmgMul=1;
  yield* wait(e,.3);
}
function* sawSlide(e){
  sfx.whirr();sfx.charge();const y0=e.y;
  yield* tween(e,.7,k=>{e.glow=k;e.rev=1;e.y=lerp(y0,y0+36,k);e.ox=k*26;e.tilt=-k*.05;e.jit=k});
  sfx.launch();
  const hz=haz({shape:'rect',w:200,h:150,dmg:13,life:9,follow:h=>{h.x=e.x+e.ox-30;h.y=e.y+e.oy}});
  const sx=e.x,stopX=150;
  while(e.x>stopX){yield;e.x-=780*e.dt;sparkDir(e.x-96,FLOOR+12,2,-Math.PI*.15,.5,300,'255,200,110',.3);if(Math.random()<.4)smoke(e.x-90,FLOOR,1,6)}
  hz.dead=true;e.glow=0;shake(5);
  e.dmgMul=1.6;yield* wait(e,.5);
  yield* tween(e,.85,k=>{e.x=lerp(stopX,sx,ease(k));e.y=lerp(y0+36,y0,k);e.rev=lerp(1,.3,k);e.ox=lerp(26,0,k);e.tilt=0});
  e.dmgMul=1;
}
function* sawRain(e){
  sfx.whirr();
  yield* tween(e,.5,k=>{e.glow=k*.8;e.rev=.4+k*.6});
  const xs=[-210,-100,0,100,210].map(o=>clamp(P.x+o+rand(-30,30),60,W-70)).sort(()=>Math.random()-.5);
  for(let i=0;i<xs.length;i++){
    const x=xs[i];floorMark(x,34,.85);
    (function(x){
      const h=spawnProj({shape:'circle',r:22,x,y:-80,vy:0,dmg:9,life:3,arm:.85,rot:0,landed:false,
        upd:(h,dt)=>{h.rot+=dt*24;if(h.t<.85){h.y=-80;return}
          if(!h.landed){h.vy=1100;if(h.y>=FLOOR-18){h.y=FLOOR-18;h.vy=0;h.landed=true;h.life=Math.min(h.life,.3);spark(x,FLOOR,12,360,'255,210,120',.35);dust(x,FLOOR,5);shake(3);sfx.tick()}}},
        draw:(c,h)=>{if(h.t>=.85)drawBlade(c,h.x,h.y,28,h.rot)}});
    })(x);
    yield* wait(e,.17);
  }
  yield* wait(e,1.1);e.glow=0;
}

/* ---------- ENEMY 3: CHAINSAW ---------- */
function* brainChain(e){
  yield* wait(e,1.1);let last='';
  for(;;){
    yield* hover(e,rand(.5,.9),360,W*.52);
    const a=weighted([['chop',3],['dash',2.4],['fling',2.4]],last);last=a;
    if(a==='chop')yield* chainChop(e);else if(a==='dash')yield* chainDash(e);else yield* chainFling(e);
    e.glow=0;e.rev=.35;e.ox=0;e.tilt=0;
  }
}
function* chainChop(e){
  sfx.whirr();floorMark(()=>e.x-135,125,.82);
  yield* tween(e,.7,k=>{e.tilt=k*.85;e.rev=.4+k*.6;e.glow=k;e.jit=k*.6});
  sfx.launch();
  const hz=haz({shape:'rect',w:250,h:150,dmg:15,life:.28,arm:0,follow:h=>{h.x=e.x-135;h.y=e.y+e.oy+40}});
  yield* tween(e,.11,k=>{e.tilt=lerp(.85,-.28,easeIn(k))});
  sfx.slam();shake(11);hitstop(.04);
  const ix=e.x-215;spark(ix,FLOOR+4,22,520,'255,210,110',.45);dust(ix,FLOOR,10);ring(ix,FLOOR+6,10,110,.4,'255,200,120',4);debris(ix,FLOOR,8,260);
  e.dmgMul=1.5;
  yield* wait(e,.7);
  yield* tween(e,.5,k=>{e.tilt=lerp(-.28,0,ease(k));e.glow=1-k;e.rev=lerp(1,.35,k)});
  e.dmgMul=1;
}
function* chainDash(e){
  sfx.whirr();sfx.charge();const sx=e.x;

function updateEnemy(e,dt){
  e.t+=dt;e.dt=dt;e.flash=Math.max(0,e.flash-dt);e.jit=Math.max(0,e.jit-dt*3);
  if(e.hp<e.ghost)e.ghost=Math.max(e.hp,e.ghost-dt*e.max*.45);
  if(e.dead){updateDeath(e,dt);return}
  if(e.state==='enter'){
    e.et+=dt;const k=Math.min(1,e.et/1.3);e.x=lerp(W+300,e.baseX,easeOut(k));e.oy=Math.sin(e.t*2.3)*6;
    if(e.def.boss)e.y=lerp(-30,252,easeOut(k));
    if(k>=1){e.state='fight';G.hint=1}
    return;
  }
  if(P.state==='dead')return;
  e.brain.next();
  if(e.def.boss)e.inv=e.y<226&&!e.dead;
  e.x=clamp(e.x,-400,W+400);
}

  e.deadT+=dt/Math.max(.2,G.slow);const T=e.deadT;
  const r=e_rect(e),boss=e.def.boss;

    const x=rand(r.x0,r.x1),y=rand(r.y0,r.y1);
    spark(x,y,10,380,'255,200,90',.5);smoke(x,y,2,10,'30,30,34');ember(x,y,3,200);glow(x,y,70,.3,'255,170,70');
    if(Math.random()<.4){sfx.hit();shake(5)}

  if(boss){e.y+=Math.max(0,T-.8)*Math.max(0,T-.8)*60*dt*8}
  if(T>(boss?3.0:1.3)&&e.vis){
    e.vis=false;screenFlash(.9,'255,240,210');sfx.boom();shake(20);
    const x=e.x,y=e.y;spark(x,y,60,700,'255,220,130',.9);ring(x,y+40,20,300,.8,'255,210,120',8);glow(x,y,260,.6,'255,190,90');
    debris(x,y,28,620,['#9aa6b2','#4a535e','#ffc61a','#c43a00']);smoke(x,y,14,50);
  }
  if(!e.vis&&T>(boss?3.0:1.3)+.6&&!e.done){e.done=true;stageCleared()}
}

function startLunge(){

function updatePlayer(dt,locked){
  const p=P;p.t+=dt;
  p.inv=Math.max(0,p.inv-dt);p.lungeCD=Math.max(0,p.lungeCD-dt);p.dodgeCD=Math.max(0,p.dodgeCD-dt);p.comboT=Math.max(0,p.comboT-dt);
  p.ghostHp=p.hp<p.ghostHp?Math.max(p.hp,p.ghostHp-dt*28):p.hp;
  for(let i=p.ghosts.length-1;i>=0;i--){p.ghosts[i].life-=dt;if(p.ghosts[i].life<=0)p.ghosts.splice(i,1)}
  if(p.state==='dead'){p.deadT+=dt;p.vx*=.92;p.x+=p.vx*dt;p.vy+=1900*dt;p.y=Math.min(FLOOR,p.y+p.vy*dt);if(p.y>=FLOOR)p.vy=0;return}
  const live=E&&!E.dead;
  if(live&&p.state!=='lunge'&&p.state!=='dodge'){const ex=E.x+E.ox;if(Math.abs(ex-p.x)>14)p.face=ex>p.x?1:-1}
  const din=locked?0:((Input.down.right?1:0)-(Input.down.left?1:0));
  const wasGround=p.ground;
  // gravity (all states except dashes)
  if(p.state!=='lunge'&&p.state!=='dodge'){p.vy+=1900*dt;p.y+=p.vy*dt;if(p.y>=FLOOR){if(!p.ground&&p.vy>200){dust(p.x,FLOOR,5);}p.y=FLOOR;p.vy=0;p.ground=true}else p.ground=false}
  else if(p.state==='dodge'){p.vy+=1900*dt*.4;p.y+=p.vy*dt;if(p.y>=FLOOR){p.y=FLOOR;p.vy=0;p.ground=true}}
  const free=p.state==='free';
  if(free||(p.state==='slash')){
    // action buffering
    if(!locked){
      if(p.dodgeCD<=0&&consume('dodge')){startDodge(din||-p.face);}
      else if(p.lungeCD<=0&&(free||p.st>p.dur*.35)&&consume('lunge')){startLunge()}
      else if((free||p.st>=p.dur*.62)&&consume('slash')){startSlash()}
    }
  }
  if(p.state==='free'){
    const tv=din*SPEED;
    const a=(Math.abs(tv)>Math.abs(p.vx)||Math.sign(tv)!==Math.sign(p.vx))?3400:2600;
    p.vx+=clamp(tv-p.vx,-a*dt,a*dt);
    if(!locked&&p.ground&&consume('jump')){p.vy=-615;p.ground=false;sfx.jump();dust(p.x,FLOOR,4)}
    else if(!locked&&!p.ground&&consume('jump',60)&&false){}
    p.x+=p.vx*dt;
    p.walk+=dt*Math.abs(p.vx)*.052;
  }else if(p.state==='slash'){
    p.st+=dt;p.vx*=Math.pow(.0008,dt);p.x+=p.vx*dt;
    const w0=p.dur*.2,w1=p.dur*.58;
    if(!p.hitDone&&p.st>=w0&&p.st<=w1&&live){
      const reach=p.heavy?118:98;
      const box={x0:p.face>0?p.x+4:p.x-reach,x1:p.face>0?p.x+reach:p.x-4,y0:p.y-112,y1:p.y-10};
      if(rectsOverlap(box,e_rect(E))){p.hitDone=true;hurtEnemy(p.heavy?12:6,p.heavy?'heavy':'light')}
    }
    if(p.st>=p.dur){p.state='free';p.comboT=.5}
  }else if(p.state==='lunge'){
    p.st+=dt;p.ghostT-=dt;
    if(p.ghostT<=0){p.ghostT=.03;p.ghosts.push({x:p.x,y:p.y,face:p.face,life:.22})}
    if(p.st<p.dur){
      const step=p.face*1380*dt;p.x+=step;
      if(live&&!p.hitDone){const r=e_rect(E),b={x0:p.x-24,x1:p.x+24,y0:p.y-104,y1:p.y-6};
        if(rectsOverlap(b,r)){p.hitDone=true;p.x=p.face>0?Math.min(p.x,r.x0-22):Math.max(p.x,r.x1+22);hurtEnemy(16,'lunge');p.st=p.dur;p.vx=-p.face*200;p.vy=-160;p.ground=false}}
    }
    if(p.st>=p.dur+.14){p.state='free';p.comboT=.3}
  }else if(p.state==='dodge'){
    p.st+=dt;p.ghostT-=dt;p.x+=p.vx*dt;p.vx*=Math.pow(.02,dt*1.2);
    if(p.ghostT<=0){p.ghostT=.035;p.ghosts.push({x:p.x,y:p.y,face:p.face,life:.2})}
    if(p.st>=p.dur){p.state='free';p.vx*=.3}
  }else if(p.state==='hurt'){
    p.st+=dt;p.vx*=Math.pow(.02,dt);p.x+=p.vx*dt;
    if(p.st>=.3&&p.ground)p.state='free';
  }

}
function poseOf(p){
  const m={t:p.t,walk:p.walk,speed:clamp(Math.abs(p.vx)/SPEED,0,1)*(p.ground?1:0),crouch:0,air:p.ground?0:1,lean:0,headX:0,headY:0,headTilt:0,antBack:0,wing:0,rot:0,tailUp:0,eyeHot:0,
    nFa:.7+Math.sin(p.t*2.4)*.05,nTa:-2.88,fFa:.62+Math.sin(p.t*2.4+1)*.05,fTa:-2.95,nearDx:0,farDx:0,dy:0};
  const rest={nFa:m.nFa,nTa:m.nTa,fFa:m.fFa,fTa:m.fTa};
  const arm=(which,k)=>{ // k: 0 rest -> 1 raised
    const fa=lerp(which?rest.fFa:rest.nFa,-1.25,k),ta=lerp(which?rest.fTa:rest.nTa,.6,k);
    if(which){m.fFa=fa;m.fTa=ta}else{m.nFa=fa;m.nTa=ta}
  };
  const setArm=(which,fa,ta)=>{if(which){m.fFa=fa;m.fTa=ta}else{m.nFa=fa;m.nTa=ta}};
  if(!p.ground&&p.state==='free'){m.wing=.55;m.lean=p.vy<0?.1:-.08;m.antBack=1;m.nFa=.1;m.nTa=-.5;m.fFa=.2;m.fTa=-.4}
  switch(p.state){
    case 'slash':{
      const k=p.st/p.dur;const w=p.heavy?.3:.25,s=p.heavy?.58:.55;
      const raise=k<w?ease(k/w):(k<s?1-Math.min(1,(k-w)/(s-w)):0);
      // strike: arm goes raised -> extended
      let fa,ta,lean=0;
      if(k<w){const u=ease(k/w);fa=lerp(.7,-1.3,u);ta=lerp(-2.88,.7,u);lean=-.12*u;m.crouch=.12*u}
      else if(k<s){const u=easeOut((k-w)/(s-w));fa=lerp(-1.3,.5,u);ta=lerp(.7,.55,u);lean=lerp(-.12,.32,u);m.headX=8*u;m.crouch=lerp(.12,.0,u)}
      else{const u=ease((k-s)/(1-s));fa=lerp(.5,.7,u);ta=lerp(.55,-2.88,u);lean=lerp(.32,0,u);m.headX=lerp(8,0,u)}
      if(p.heavy){setArm(0,fa,ta);setArm(1,fa-.1,ta+.05);lean*=1.5;m.tailUp=-10*(k<s?1:0)}
      else setArm(p.arm,fa,ta);
      m.lean+=lean;m.wing=.25;break}
    case 'lunge':{
      const k=Math.min(1,p.st/p.dur);m.lean=.55;m.headX=10;m.wing=.9;m.air=.9;m.eyeHot=1;m.antBack=1;
      setArm(0,-.05,.02);setArm(1,-.12,-.05);m.crouch=.1;m.nearDx=6;
      if(p.st>=p.dur){const u=(p.st-p.dur)/.14;m.lean=lerp(.55,0,u);m.wing=lerp(.9,.2,u);m.eyeHot=1-u}break}
    case 'dodge':{m.crouch=.5;m.lean=-.28;m.wing=.35;m.antBack=1;m.air=.4;m.rot=.12*(p.dir||1)*p.face*-1+.0;m.headX=-4;break}
    case 'hurt':{const u=Math.min(1,p.st/.3);m.lean=-.45*(1-u*.5);m.headTilt=-.35;m.rot=-.14*(1-u);m.air=p.ground?0:1;m.wing=.6;setArm(0,-.5,.4);setArm(1,-.3,.5);m.antBack=1;break}
    case 'dead':{const u=Math.min(1,p.deadT/.9);m.rot=-1.45*easeOut(u);m.air=1;m.wing=.7;m.lean=-.3;setArm(0,-.3,.9);setArm(1,-.1,1);m.dy=-26*u;m.crouch=0;break}
  }
  if(G.state==='clear'||G.state==='victory'||G.state==='transition'){
    if(G.state==='victory'||(G.state==='clear'&&E&&E.dead)){const b=Math.abs(Math.sin(p.t*5));m.nFa=-1.9;m.nTa=-1.25;m.fFa=-1.7;m.fTa=-1.05;m.wing=.9;m.lean=-.12;m.dy=-b*5;m.antBack=1;m.eyeHot=.0}
  }
  return m;
}

/* ---------- stage flow ---------- */

/* ---------- ambient ---------- */
function initAmb(i){
  amb.length=0;const n=i===4?46:34;
  for(let k=0;k<n;k++)amb.push({x:rand(0,W),y:rand(0,H),vx:rand(-8,8),vy:i===4?rand(-40,-10):(i===2?rand(-14,-2):rand(2,10)),r:rand(.8,2.6),a:rand(.2,.7),ph:rand(0,TAU)});
}
function drawAmb(c){
  const i=G.stage;const col=i===4?'255,150,60':(i===2?'255,200,120':(i===3?'230,200,160':'255,236,200'));
  c.save();c.globalCompositeOperation='lighter';
  for(const m of amb){const a=m.a*(.6+.4*Math.sin(G.t*1.5+m.ph));c.fillStyle='rgba('+col+','+a+')';c.beginPath();c.arc(m.x,m.y,m.r,0,TAU);c.fill()}

function updateAmb(dt){for(const m of amb){m.x+=m.vx*dt;m.y+=m.vy*dt;if(m.y<-10)m.y=H+10;if(m.y>H+10)m.y=-10;if(m.x<-10)m.x=W+10;if(m.x>W+10)m.x=-10}}

/* ---------- update ---------- */
function update(raw){
  G.rt+=raw;
  if(G.hs>0){G.hs-=raw;if(G.hs>0)return}
  if(G.slowT>0){G.slowT-=raw;if(G.slowT<=0)G.slow=1}
  const dt=raw*G.slow;G.t+=dt;G.stateT+=raw;
  G.shake*=Math.pow(.02,raw);if(G.shake<.2)G.shake=0;
  G.flash=Math.max(0,G.flash-raw*2.2);G.hurtFlash=Math.max(0,G.hurtFlash-raw);
  if(G.banner){G.banner.t+=raw;if(G.banner.t>G.banner.dur)G.banner=null}
  if(G.tip>0)G.tip-=raw;
  updateAmb(dt);
  switch(G.state){
    case 'title':{G.t+=0;titleUpdate(dt);break}
    case 'fight':{
      G.time+=raw;
      updatePlayer(dt,false);
      if(E)updateEnemy(E,dt);
      updateHaz(dt);updateParts(dt);
      break}
    case 'clear':{updatePlayer(dt,true);if(E)updateEnemy(E,dt);updateParts(dt);break}
    case 'cleared':{
      updatePlayer(dt,true);updateParts(dt);
      if(G.stateT>2.0)beginTransition();break}
    case 'transition':{
      G.trT+=raw;const k=Math.min(1,G.trT/2.1);
      P.state='free';P.face=1;P.vx=SPEED;P.walk+=dt*12;P.x=lerp(G.trFrom,190,ease(k));P.y=FLOOR;P.ground=true;
      updateParts(dt);
      if(k>=1){resetPlayer(false);startStage(G.stage+1,false)}
      break}
    case 'dead':{updatePlayer(dt,true);if(E)updateEnemy(E,dt);updateHaz(dt);updateParts(dt);break}
    case 'victory':{updatePlayer(dt,true);if(E)updateEnemy(E,dt);updateParts(dt);if(Math.random()<dt*7)spark(rand(60,W-60),rand(60,200),14,260,pick(['120,255,140','255,220,120','255,255,255']),1,300);break}
  }
}

/* ---------- HUD ---------- */
function bar(c,x,y,w,h,pct,ghost,cols,flip,ticks){

  c.fillStyle='rgba(8,10,12,.78)';rr(c,x-3,y-3,w+6,h+6,h/2+3);c.fill();
  c.strokeStyle='rgba(255,255,255,.22)';c.lineWidth=1.4;c.stroke();
  c.save();rr(c,x,y,w,h,h/2);c.clip();
  const gw=w*clamp(ghost,0,1),fw=w*clamp(pct,0,1);
  c.fillStyle='rgba(255,255,255,.5)';c.fillRect(flip?x+w-gw:x,y,gw,h);
  c.fillStyle=lg(c,0,y,0,y+h,cols);c.fillRect(flip?x+w-fw:x,y,fw,h);
  c.fillStyle='rgba(255,255,255,.28)';c.fillRect(flip?x+w-fw:x,y+1,fw,h*.32);
  c.fillStyle='rgba(0,0,0,.35)';for(let i=1;i<ticks;i++)c.fillRect(x+w*i/ticks-.8,y,1.6,h);
  c.restore();c.restore();
}
function txt(c,s,x,y,size,col,align,stroke){
  c.font='900 '+size+'px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';c.textAlign=align||'left';c.textBaseline='alphabetic';
  if(stroke!==0){c.lineWidth=stroke||Math.max(3,size*.16);c.lineJoin='round';c.strokeStyle='rgba(0,0,0,.85)';c.strokeText(s,x,y)}
  c.fillStyle=col||'#fff';c.fillText(s,x,y);
}
function drawHUD(c){
  const L=Math.max(24,G.inset.l+14),R=Math.max(24,G.inset.r+14),T=Math.max(14,G.inset.t+8);
  const bw=Math.min(250,W*.27);
  // player
  txt(c,'MANTIS',L,T+11,13,'#caffa8',null,3);txt(c,'LV.100',L+62,T+11,11,'#ffe14a',null,3);
  bar(c,L,T+16,bw,15,P.hp/P.max,P.ghostHp/P.max,[[0,'#c9ff8a'],[.5,'#5fd14a'],[1,'#2a8a35']],false,10);
  // cooldown pips
  const cy=T+43;
  const pip=(x,label,cd,max,col)=>{c.save();const rdy=cd<=0;c.globalAlpha=rdy?1:.55;circle(c,x,cy,7);c.fillStyle='rgba(8,10,12,.8)';c.fill();c.strokeStyle=rdy?col:'rgba(255,255,255,.3)';c.lineWidth=1.6;c.stroke();
    if(!rdy){c.beginPath();c.moveTo(x,cy);c.arc(x,cy,6,-Math.PI/2,-Math.PI/2+TAU*(1-cd/max));c.closePath();c.fillStyle=col;c.fill()}else{circle(c,x,cy,3.4);c.fillStyle=col;c.fill()}
    c.restore();txt(c,label,x+12,cy+4,10,rdy?'#fff':'#9aa',null,2.5)};
  pip(L+7,'LUNGE',P.lungeCD,1.25,'#ffc15a');pip(L+82,'DODGE',P.dodgeCD,.7,'#7ac8ff');
  // enemy
  if(E){
    const x=W-R-bw-(Input.touch||true?86:0);
    txt(c,E.name,x+bw,T+11,13,E.def.boss?'#ffb48a':'#ffd2a0','right',3);
    bar(c,x,T+16,bw,15,E.hp/E.max,E.ghost/E.max,E.def.boss?[[0,'#ffe27a'],[.5,'#ff7a1a'],[1,'#b8260a']]:[[0,'#ffb4a0'],[.5,'#f2493a'],[1,'#9a1a14']],true,E.def.boss?20:10);
  }
  // stage pips
  const px=W/2-2*22;for(let i=0;i<5;i++){const x=px+i*22,y=T+14;circle(c,x,y,6);c.fillStyle=i<G.stage?'#ffe14a':(i===G.stage?'#9be86a':'rgba(255,255,255,.15)');c.fill();c.strokeStyle='rgba(0,0,0,.7)';c.lineWidth=2;c.stroke();if(i===4){c.strokeStyle='#ff5a3a';c.lineWidth=1.4;circle(c,x,y,8.5);c.stroke()}}
  // tip
  if(G.tip>0&&G.state==='fight'&&E&&E.state==='fight'){
    const a=Math.min(1,G.tip)*.95;c.save();c.globalAlpha=a;
    txt(c,'Machines GLOW RED before they strike. DODGE through the attack!',W/2,H-58,15,'#ffe9b0','center',4);c.restore()}
  // banner
  const B=G.banner;
  if(B){
    const k=B.t/B.dur,inT=Math.min(1,B.t/.25),outT=Math.min(1,(B.dur-B.t)/.35),a=Math.min(inT,outT);
    c.save();c.globalAlpha=a;
    const cy=H*.36,sl=(1-easeOut(inT))*120;
    c.fillStyle='rgba(0,0,0,.5)';c.fillRect(0,cy-48,W,96);
    c.fillStyle=B.col;c.fillRect(0,cy-48,W,3);c.fillRect(0,cy+45,W,3);
    txt(c,B.text,W/2-sl,cy+10,52,B.col,'center',7);
    txt(c,B.sub,W/2+sl,cy+38,19,'#ffffff','center',4);
    if(B.small)txt(c,B.small,W/2+sl,cy-30,12,'#cbd5dc','center',3);
    c.restore();
  }
  // end overlays
  if(G.state==='dead'&&G.stateT>1.2){
    c.fillStyle='rgba(0,0,0,'+Math.min(.62,(G.stateT-1.2)*.8)+')';c.fillRect(0,0,W,H);
    const a=Math.min(1,(G.stateT-1.2)*2);c.save();c.globalAlpha=a;
    txt(c,'DEFEATED',W/2,H*.42,58,'#ff5a4a','center',8);
    txt(c,'The machine wins this round.',W/2,H*.42+34,17,'#ffffff','center',4);
    if(Math.floor(G.rt*2)%2===0)txt(c,'TAP TO RETRY STAGE '+(G.stage+1),W/2,H*.42+82,22,'#ffe14a','center',5);
    c.restore();
  }
  if(G.state==='victory'&&G.stateT>1.0){
    c.fillStyle='rgba(0,0,0,'+Math.min(.55,(G.stateT-1)*.6)+')';c.fillRect(0,0,W,H);
    const a=Math.min(1,(G.stateT-1)*1.6);c.save();c.globalAlpha=a;
    txt(c,'THE MANTIS WINS',W/2,H*.36,56,'#9be86a','center',8);
    txt(c,'All five machines destroyed.',W/2,H*.36+32,18,'#fff','center',4);
    const mm=Math.floor(G.time/60),ss=(G.time%60).toFixed(1);
    txt(c,'TIME  '+mm+':'+(ss<10?'0':'')+ss+'     DEFEATS  '+G.deaths,W/2,H*.36+68,17,'#ffe14a','center',4);
    if(G.best){const bm=Math.floor(G.best/60),bs=(G.best%60).toFixed(1);txt(c,(G.newBest?'NEW BEST  ':'BEST  ')+bm+':'+(bs<10?'0':'')+bs,W/2,H*.36+94,15,G.newBest?'#7dff8a':'#cbd5dc','center',4)}
    if(G.stateT>2.2&&Math.floor(G.rt*2)%2===0)txt(c,'TAP TO PLAY AGAIN',W/2,H*.36+136,22,'#fff','center',5);
    c.restore();
  }
  if(G.paused&&!G.debug){c.fillStyle='rgba(0,0,0,.6)';c.fillRect(0,0,W,H);txt(c,'PAUSED',W/2,H*.45,54,'#fff','center',8);txt(c,'TAP TO RESUME',W/2,H*.45+40,20,'#ffe14a','center',5)}
}

/* ---------- title ---------- */
function renderTitle(c){
  if(!G.bgTitle)G.bgTitle=bakeBg(4);
  c.drawImage(G.bgTitle,0,0,W,H);
  c.save();c.globalCompositeOperation='lighter';c.fillStyle='rgba(255,90,20,'+(.06+.03*Math.sin(G.rt*2))+')';c.fillRect(0,0,W,H);c.restore();
  // boss head hovering right
  const hx=W*.78,hy=232+Math.sin(G.rt*1.6)*6;
  const fake={x:hx,y:hy,ox:0,oy:0,tilt:.2,glow:.55+.4*Math.sin(G.rt*3),flash:0,t:G.rt,rev:0,def:STAGES[4],hb:STAGES[4].hb,pv:STAGES[4].pv,vis:true,jit:0,dead:false,state:'fight',bladeOut:true};
  drawEnemy(c,fake);
  drawParts(c,'back');
  // mantis idle
  const sp=P.state;P.state='free';P.t=G.rt;P.vx=0;P.ground=true;P.y=FLOOR;P.x=W*.2;P.face=1;P.inv=0;P.ghosts.length=0;
  drawShadow(c,P.x,FLOOR+4,46,.45);drawPlayer(c);P.state=sp;
  drawParts(c,'front');
  // title
  const cx=W/2;
  c.save();c.textAlign='center';
  c.font='900 italic 86px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
  c.lineJoin='round';c.lineWidth=14;c.strokeStyle='#0b1a0e';c.strokeText('MANTIS',cx,112);
  c.fillStyle=lg(c,0,50,0,118,[[0,'#eaffc4'],[.45,'#8fe35a'],[1,'#2f9a3a']]);c.fillText('MANTIS',cx,112);
  c.font='900 italic 34px system-ui,Arial,sans-serif';c.lineWidth=8;c.strokeStyle='#1a0a02';c.strokeText('VS',cx,150);c.fillStyle=lg(c,0,126,0,152,[[0,'#ffe27a'],[1,'#ff7a1a']]);c.fillText('VS',cx,150);
  c.font='900 italic 62px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';c.lineWidth=12;c.strokeStyle='#0b0d10';c.strokeText('MACHINE',cx,206);
  c.fillStyle=lg(c,0,160,0,210,[[0,'#ffffff'],[.4,'#aab6c2'],[.7,'#6b7783'],[1,'#c9d3dc']]);c.fillText('MACHINE',cx,206);
  c.restore();
  txt(c,'LEVEL 100 MANTIS. FIVE ANGRY POWER TOOLS.',cx,236,14,'#ffd9a8','center',4);
  if(Math.floor(G.rt*1.8)%2===0)txt(c,'TAP TO START',cx,H-86,28,'#fff','center',6);
  txt(c,Input.touch?'Left pad: move  |  Buttons: slash, lunge, dodge, jump':'A/D move  |  W jump  |  J slash  |  K lunge  |  L dodge  |  P pause',cx,H-58,13,'#c8d2da','center',4);
  if(G.best){const bm=Math.floor(G.best/60),bs=(G.best%60).toFixed(1);txt(c,'BEST CLEAR  '+bm+':'+(bs<10?'0':'')+bs,cx,H-36,12,'#9be86a','center',3)}
}

/* ---------- main wiring ---------- */
function tap(){
  audioInit();
  if(G.paused){G.paused=false;return}
  if(G.state==='title'){sfx.ui();startRun()}
  else if(G.state==='dead'&&G.stateT>1.6){sfx.ui();retryStage()}
  else if(G.state==='victory'&&G.stateT>2.2){sfx.ui();G.state='title';G.stateT=0;E=null;parts.length=0;fxs.length=0;hazs.length=0;resetPlayer(true);
    document.getElementById('bPause').style.display='none'}
}
cv.addEventListener('pointerdown',e=>{if(G.state==='title'||G.state==='dead'||G.state==='victory'||G.paused)tap()});
window.onKey=code=>{
  if(code==='Enter'||(code==='Space'&&(G.state==='title'||G.state==='dead'||G.state==='victory')))tap();
  if(code==='KeyP'||code==='Escape')togglePause();
  if(code==='KeyM')toggleMute();
};
function togglePause(){if(G.state==='fight'||G.paused){G.paused=!G.paused;clearInput()}}
function toggleMute(){setMuted(!muted);document.getElementById('bMute').style.opacity=muted?.4:.8}
document.getElementById('bPause').addEventListener('pointerdown',e=>{e.stopPropagation();audioInit();togglePause()});
document.getElementById('bMute').addEventListener('pointerdown',e=>{e.stopPropagation();audioInit();toggleMute()});
document.getElementById('bMute').style.opacity=muted?.4:.8;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='fight')G.paused=true});

function measureInsets(){
  const el=document.createElement('div');el.style.cssText='position:fixed;left:0;top:0;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
  document.body.appendChild(el);const cs=getComputedStyle(el);
  const k=1/(VIEW.S/Math.min(window.devicePixelRatio||1,2));
  G.inset={l:(parseFloat(cs.paddingLeft)||0)*k,r:(parseFloat(cs.paddingRight)||0)*k,t:(parseFloat(cs.paddingTop)||0)*k,b:(parseFloat(cs.paddingBottom)||0)*k};
  el.remove();
}
window.onGameResize=()=>{
  sizeBuf(bufP);sizeBuf(bufE);measureInsets();
  G.bgTitle=null;
  if(G.state!=='title'&&G.stage>=0){G.bgCur=bakeBg(G.stage);if(G.bgNext)G.bgNext=bakeBg(G.stage+1)}
  if(E&&!E.dead)E.baseX=E.def.bx();
  initAmb(G.stage);
};
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,150));

let lastT=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let raw=Math.min(.05,(now-lastT)/1000);lastT=now;
  if(document.body.classList.contains('portrait')){return}
  if(!G.paused){update(raw)}
  render();
}
resize();
G.bgCur=null;initAmb(4);
document.getElementById('bPause').style.display='none';
const inst=document.getElementById('install');let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;inst.style.display='block'});
inst.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch(_){}deferredPrompt=null;inst.style.display='none'});
window.addEventListener('appinstalled',()=>{inst.style.display='none'});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
window.__g={G,P,get E(){return E},STAGES,startRun,startStage,hurtEnemy,hurtPlayer,killEnemy,bakeBg,hazs,fxs,parts};
requestAnimationFrame(frame);
</script>
